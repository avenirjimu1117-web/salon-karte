<!DOCTYPE html>
<html lang="ja">
<script>
  // GAS エンドポイント定義
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyTaHJP7o9ByAciGYg6mvzN_o_4UIQslMaJcU7X8ZLCwS1DQ-Y-Y78I1d92fnSriMrX/exec';
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客共通カルテ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Playfair Display, Montserrat, Noto Sans JP) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <!-- Font Awesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        salon: {
                            light: '#F9F9F9',    /* 清潔感のある極浅グレー */
                            bg: '#FFFFFF',       /* メイン背景：白 */
                            card: '#FFFFFF',     /* カード背景 */
                            accent: '#7E7E7E',   /* 落ち着いたミディアムグレー */
                            primary: '#2C2C2C',  /* 深みのあるダークチャコール */
                            text: '#333333',     /* 柔らかい黒 */
                            border: '#EAEAEA',   /* 淡いグレーの境界線 */
                            focused: '#A1A1A1',  /* フォーカス時のグレー */
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans JP', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #F9F9F9;
            color: #333333;
            letter-spacing: 0.05em;
        }
        .brand-title {
            font-family: 'Montserrat', 'Playfair Display', serif;
            letter-spacing: 0.15em;
        }
        /* スムーズなフェードインアウト */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #F9F9F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CCCCCC;
            border-radius: 3px;
        }
    </style>
</head>

<body class="min-h-screen pb-16">



<!-- メインコンテンツラッパー -->
<div class="max-w-2xl mx-auto px-4 mt-8">
    
    <!-- ヘッダーデザイン -->
    <div class="text-center py-8 mb-6 bg-white rounded-3xl border border-salon-border shadow-sm p-6">
        <!-- 動的ブランドロゴ (店舗切り替えで美しく変化) -->
        <h1 id="brand-logo-text" class="brand-title text-2xl md:text-3xl font-light tracking-widest text-salon-primary mb-3 transition-all duration-300">
            Arbre et chimie
        </h1>
        <div class="h-[1px] w-16 bg-salon-accent/20 mx-auto mb-4"></div>
        
        <p class="text-[11px] text-gray-400 leading-relaxed">
            本日はご来店いただき、誠にありがとうございます。<br>
            サービス向上のため、お手数ですがカウンセリングシートのご記入をお願い致します。
        </p>
    </div>

    <!-- カルテ入力フォーム -->
    <form id="karte-form" onsubmit="handleFormSubmit(event)" class="space-y-6 fade-in">
        
        <!-- 基本情報カード -->
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-salon-border space-y-4">
            <h2 class="text-sm font-bold tracking-wider text-salon-primary flex items-center gap-2 border-b border-salon-border pb-3">
                <i class="fa-regular fa-user text-xs"></i>
                お客様情報のご入力
            </h2>

            <!-- フリガナ ＆ お名前 (1行並列) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- フリガナ -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        フリガナ <span class="text-red-400 text-[9px] font-normal ml-1">必須</span>
                    </label>
                    <input type="text" id="kana" required placeholder="例：ヤマダ ハナコ" 
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
                </div>
                <!-- お名前 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        お名前 <span class="text-red-400 text-[9px] font-normal ml-1">必須</span>
                    </label>
                    <input type="text" id="name" required placeholder="例：山田 花子" 
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
                </div>
            </div>

            <!-- 生年月日 ＆ 性別 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 生年月日 (任意) -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        生年月日
                    </label>
                    <input type="date" id="birthdate"
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors text-gray-600">
                </div>
                <!-- 性別 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        性別 <span class="text-red-400 text-[9px] font-normal ml-1">必須</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-center py-2.5 px-4 rounded-lg border border-salon-border cursor-pointer bg-white hover:bg-salon-light/60 transition-colors text-xs text-gray-600">
                            <input type="radio" name="gender" value="女性" required class="mr-2 accent-salon-accent">
                            女性
                        </label>
                        <label class="flex items-center justify-center py-2.5 px-4 rounded-lg border border-salon-border cursor-pointer bg-white hover:bg-salon-light/60 transition-colors text-xs text-gray-600">
                            <input type="radio" name="gender" value="男性" class="mr-2 accent-salon-accent">
                            男性
                        </label>
                    </div>
                </div>
            </div>

            <!-- 郵便番号 ＆ 住所 (1行並列) -->
            <div class="flex flex-col md:flex-row gap-4">
                <!-- 郵便番号 -->
                <div class="w-full md:w-1/4">
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        郵便番号
                    </label>
                    <input type="text" id="zip" placeholder="例：123-4567" 
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
                </div>
                <!-- 住所 -->
                <div class="w-full md:w-3/4">
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        住所
                    </label>
                    <input type="text" id="address" placeholder="例：東京都渋谷区○○ 1-2-3" 
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
                </div>
            </div>

            <!-- 電話番号 ＆ メールアドレス (1行並列) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 電話番号 -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        電話番号 <span class="text-red-400 text-[9px] font-normal ml-1">必須</span>
                    </label>
                    <input type="tel" id="tel" required placeholder="例：090-1234-5678" 
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
                </div>
                <!-- メールアドレス -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">
                        メールアドレス
                    </label>
                    <input type="email" id="email" placeholder="例：example@mail.com" 
                           class="w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
                </div>
            </div>

            <!-- ご職業 -->
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">
                    ご職業
                </label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
                    <button type="button" onclick="selectJob('お勤め')" class="job-btn py-2 px-1 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all">お勤め</button>
                    <button type="button" onclick="selectJob('主婦')" class="job-btn py-2 px-1 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all">主婦</button>
                    <button type="button" onclick="selectJob('学生')" class="job-btn py-2 px-1 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all">学生</button>
                    <button type="button" onclick="selectJob('その他')" class="job-btn py-2 px-1 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all">その他</button>
                </div>
                
                <!-- 学生選択時に出現するサブボタンエリア -->
                <div id="student-options" class="hidden fade-in bg-salon-light/70 p-3 rounded-xl border border-salon-border/60 mb-3">
                    <label class="block text-[11px] font-bold text-gray-500 mb-2">学校区分を選択してください</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <button type="button" onclick="selectStudentType(this, '大学')" class="student-type-btn py-2 px-1 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all">大学</button>
                        <button type="button" onclick="selectStudentType(this, '専門')" class="student-type-btn py-2 px-1 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all">専門</button>
                        <button type="button" onclick="selectStudentType(this, '高校')" class="student-type-btn py-2 px-1 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all">高校</button>
                        <button type="button" onclick="selectStudentType(this, 'その他')" class="student-type-btn py-2 px-1 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all">その他</button>
                    </div>
                </div>

                <!-- その他詳細テキスト入力欄 -->
                <input type="text" id="job-other" placeholder="詳細をご記入ください" 
                       class="hidden w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
            </div>
        </div>

        <!-- アンケートカード -->
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-salon-border space-y-6">
            <h2 class="text-sm font-bold tracking-wider text-salon-primary flex items-center gap-2 border-b border-salon-border pb-3">
                <i class="fa-regular fa-comment-dots text-xs"></i>
                アンケートにご協力ください
            </h2>

            <!-- 来店動機 -->
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2">
                    Q1. ご来店動機を教えてください
                </label>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <label class="flex items-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors">
                        <input type="radio" name="trigger" value="ご紹介" onchange="handleTriggerChange('ご紹介')" class="mr-2 accent-salon-accent">
                        ご紹介
                    </label>
                    <label class="flex items-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors">
                        <input type="radio" name="trigger" value="広告・ホームページ" onchange="handleTriggerChange('広告・ホームページ')" class="mr-2 accent-salon-accent">
                        広告 / ホームページ
                    </label>
                    <label class="flex items-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors">
                        <input type="radio" name="trigger" value="検索サイト" onchange="handleTriggerChange('検索サイト')" class="mr-2 accent-salon-accent">
                        検索サイト
                    </label>
                    <label class="flex items-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors">
                        <input type="radio" name="trigger" value="自宅・職場が近い / その他" onchange="handleTriggerChange('自宅・職場が近い / その他')" class="mr-2 accent-salon-accent">
                        自宅・職場が近い / その他
                    </label>
                </div>

                <!-- 検索サイト選択時に出現するサブボタンエリア -->
                <div id="search-options" class="hidden fade-in bg-salon-light/70 p-3 rounded-xl border border-salon-border/60 mb-2">
                    <label class="block text-[11px] font-bold text-gray-500 mb-2">利用した検索サイト・アプリをお選びください</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <button type="button" onclick="selectSearchType(this, 'ホットペッパービューティー')" class="search-type-btn py-2 px-2 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all flex items-center justify-center gap-1.5">
                            <i class="fa-regular fa-bookmark text-gray-400"></i> ホットペッパー
                        </button>
                        <button type="button" onclick="selectSearchType(this, '楽天ビューティー')" class="search-type-btn py-2 px-2 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all flex items-center justify-center gap-1.5">
                            <i class="fa-regular fa-star text-gray-400"></i> 楽天ビューティー
                        </button>
                        <button type="button" onclick="selectSearchType(this, 'その他検索サイト')" class="search-type-btn py-2 px-2 text-[11px] border border-salon-border rounded-lg bg-white hover:bg-gray-50 transition-all flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-magnifying-glass text-gray-300"></i> その他検索サイト
                        </button>
                    </div>
                </div>

                <!-- ご紹介・その他来店動機のテキスト詳細枠 -->
                <input type="text" id="trigger-detail" placeholder="ご紹介者様のお名前、または詳細" 
                       class="hidden w-full px-4 py-2.5 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors">
            </div>

            <!-- 接客のご要望 -->
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2">
                    Q2. 接客へのご要望を教えてください
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <label class="flex items-center justify-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors text-center">
                        <input type="radio" name="service-request" value="ゆっくり過ごしたい" class="mr-2 accent-salon-accent">
                        ゆっくり過ごしたい
                    </label>
                    <label class="flex items-center justify-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors text-center">
                        <input type="radio" name="service-request" value="楽しく話したい" class="mr-2 accent-salon-accent">
                        楽しく話したい
                    </label>
                    <label class="flex items-center justify-center p-3 rounded-lg border border-salon-border cursor-pointer bg-white text-xs hover:bg-salon-light/50 transition-colors text-center">
                        <input type="radio" name="service-request" value="特にこだわらない" class="mr-2 accent-salon-accent">
                        特にこだわらない
                    </label>
                </div>
            </div>

            <!-- サロンに最も求めるもの（複数選択・最大3つ制限） -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-gray-500">
                        Q3. サロンに最も求めるものはなんですか？ <span class="text-gray-400 font-normal">(3つまで選択可能)</span>
                    </label>
                    <span class="text-xs font-bold text-salon-accent bg-salon-light px-2.5 py-0.5 rounded-full" id="demand-counter">0 / 3</span>
                </div>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    <!-- 選択ボタン群 -->
                    <button type="button" onclick="toggleDemand(this, 'もちの良さ')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>もちの良さ</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '似合わせ力')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>似合わせ力</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '施術スピード')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>施術スピード</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '接客・アドバイス')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>接客・アドバイス</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '予約の取りやすさ')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>予約の取りやすさ</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '営業時間')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>営業時間</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '接客')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>接客</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '雰囲気')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>雰囲気</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                    <button type="button" onclick="toggleDemand(this, '利便性')" class="demand-btn p-3 text-xs border border-salon-border rounded-lg bg-white hover:bg-salon-light transition-all text-left flex items-center justify-between">
                        <span>利便性</span>
                        <i class="fa-regular fa-square text-gray-300 text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- アレルギー -->
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2">
                    Q4. アレルギーはございますか？ <span class="text-red-400 text-[9px] font-normal ml-1">必須</span>
                </label>
                <div class="grid grid-cols-2 gap-4 mb-2">
                    <label class="flex items-center justify-center py-2.5 px-4 rounded-lg border border-salon-border cursor-pointer bg-white hover:bg-salon-light/50 transition-colors text-xs text-gray-600">
                        <input type="radio" name="allergy" value="あり" required onchange="toggleAllergyDetail(true)" class="mr-2 accent-salon-accent">
                        ある
                    </label>
                    <label class="flex items-center justify-center py-2.5 px-4 rounded-lg border border-salon-border cursor-pointer bg-white hover:bg-salon-light/50 transition-colors text-xs text-gray-600">
                        <input type="radio" name="allergy" value="なし" onchange="toggleAllergyDetail(false)" class="mr-2 accent-salon-accent">
                        ない
                    </label>
                </div>
                <textarea id="allergy-detail" placeholder="具体的なアレルギー物質や症状をご記入ください" rows="2"
                          class="hidden w-full px-4 py-2 rounded-lg border border-salon-border bg-salon-light/30 focus:outline-none focus:border-salon-focused text-sm transition-colors"></textarea>
            </div>
        </div>

        <!-- 送信ボタン -->
        <div class="pt-2 text-center">
            <button type="submit" 
                    class="w-full bg-salon-primary hover:bg-[#1A1A1A] text-white py-4 px-6 rounded-xl font-bold tracking-widest shadow-sm hover:shadow-md transition-all duration-300 transform active:scale-95 text-sm">
                ご記入内容を送信する
            </button>
            <p class="text-[10px] text-gray-400 mt-3">※ご入力いただいた個人情報は、サービス提供のみに利用し、安全に管理いたします。</p>
        </div>
    </form>

    <!-- 送信完了モーダル -->
    <div id="success-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-xl border border-salon-border fade-in">
            <div class="w-14 h-14 bg-salon-light text-salon-primary rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-regular fa-face-smile"></i>
            </div>
            <h3 class="brand-title text-xl text-salon-primary font-bold mb-2">Thank you</h3>
            <p class="text-xs font-bold text-gray-700 mb-3">ご記入ありがとうございました</p>
            <p class="text-[11px] text-gray-400 mb-6 leading-relaxed">
                カルテ情報が送信されました。<br>
            </p>
            <button onclick="closeSuccessModal()" 
                    class="w-full bg-salon-primary hover:bg-[#1A1A1A] text-white py-2.5 px-6 rounded-lg text-xs font-bold transition">
                完了
            </button>
        </div>
    </div>

</div>

<!-- JavaScript ロジック -->
<script>
    let currentShop = 'Arbre et chimie';
    let currentShopId = 'arbre';
    let selectedJob = '';
    let selectedStudentType = ''; 
    let selectedSearchType = '';  
    let selectedDemands = [];

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const shopParam = params.get('shop');
        if (shopParam) {
            const shopMap = {
                'arbre': 'Arbre et chimie',
                'choupinet': 'Choupinet by Arbre et chimie',
                'miroir': 'Miroir EYELASH&BROW',
                'liora': 'Liora nail&eye'
            };
            if (shopMap[shopParam]) {
                changeShop(shopParam, shopMap[shopParam]);
            }
        } else {
            changeShop('arbre', 'Arbre et chimie');
        }
    };

    function changeShop(shopId, shopName) {
        currentShopId = shopId;
        currentShop = shopName;
        
        const brandLogo = document.getElementById('brand-logo-text');
        brandLogo.innerText = shopName;
    }

    function selectJob(jobName) {
        selectedJob = jobName;
        selectedStudentType = ''; 
        
        const btns = document.querySelectorAll('.job-btn');
        btns.forEach(btn => {
            if (btn.innerText === jobName) {
                btn.classList.add('bg-salon-primary', 'text-white', 'border-salon-primary');
                btn.classList.remove('bg-white', 'hover:bg-salon-light');
            } else {
                btn.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary');
                btn.classList.add('bg-white', 'hover:bg-salon-light');
            }
        });

        const studentOptions = document.getElementById('student-options');
        const otherInput = document.getElementById('job-other');

        const subBtns = document.querySelectorAll('.student-type-btn');
        subBtns.forEach(b => b.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary'));

        if (jobName === '学生') {
            studentOptions.classList.remove('hidden');
            otherInput.classList.add('hidden');
            otherInput.value = '';
        } else if (jobName === 'その他') {
            studentOptions.classList.add('hidden');
            otherInput.classList.remove('hidden');
            otherInput.placeholder = '詳細をご記入ください (例: 自営業、フリーランスなど)';
            otherInput.focus();
        } else {
            studentOptions.classList.add('hidden');
            otherInput.classList.add('hidden');
            otherInput.value = '';
        }
    }

    function selectStudentType(element, typeName) {
        selectedStudentType = typeName;

        const subBtns = document.querySelectorAll('.student-type-btn');
        subBtns.forEach(btn => {
            if (btn === element) {
                btn.classList.add('bg-salon-primary', 'text-white', 'border-salon-primary');
                btn.classList.remove('bg-white');
            } else {
                btn.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary');
                btn.classList.add('bg-white');
            }
        });
    }

    function handleTriggerChange(triggerValue) {
        const searchOptions = document.getElementById('search-options');
        const detailInput = document.getElementById('trigger-detail');
        
        selectedSearchType = '';
        const subSearchBtns = document.querySelectorAll('.search-type-btn');
        subSearchBtns.forEach(b => b.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary'));

        if (triggerValue === '検索サイト') {
            searchOptions.classList.remove('hidden');
            detailInput.classList.add('hidden');
            detailInput.value = '';
        } else if (triggerValue === 'ご紹介' || triggerValue === '自宅・職場が近い / その他') {
            searchOptions.classList.add('hidden');
            detailInput.classList.remove('hidden');
            detailInput.placeholder = triggerValue === 'ご紹介' ? 'ご紹介者様のお名前をご記入ください' : '詳細を簡単にご記入ください';
            detailInput.focus();
        } else {
            searchOptions.classList.add('hidden');
            detailInput.classList.add('hidden');
            detailInput.value = '';
        }
    }

    function selectSearchType(element, typeName) {
        selectedSearchType = typeName;

        const subBtns = document.querySelectorAll('.search-type-btn');
        subBtns.forEach(btn => {
            if (btn === element) {
                btn.classList.add('bg-salon-primary', 'text-white', 'border-salon-primary');
                btn.classList.remove('bg-white');
            } else {
                btn.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary');
                btn.classList.add('bg-white');
            }
        });
    }

    function toggleDemand(element, value) {
        const index = selectedDemands.indexOf(value);
        const icon = element.querySelector('i');
        
        if (index > -1) {
            selectedDemands.splice(index, 1);
            element.classList.remove('bg-salon-light', 'border-salon-primary', 'font-bold');
            element.classList.add('bg-white');
            icon.className = 'fa-regular fa-square text-gray-300 text-sm';
        } else {
            if (selectedDemands.length >= 3) return;
            selectedDemands.push(value);
            element.classList.add('bg-salon-light', 'border-salon-primary', 'font-bold');
            element.classList.remove('bg-white');
            icon.className = 'fa-solid fa-square-check text-salon-primary text-sm';
        }

        document.getElementById('demand-counter').innerText = `${selectedDemands.length} / 3`;

        const allDemandButtons = document.querySelectorAll('.demand-btn');
        allDemandButtons.forEach(btn => {
            const btnVal = btn.querySelector('span').innerText.trim();
            if (selectedDemands.length >= 3 && !selectedDemands.includes(btnVal)) {
                btn.classList.add('opacity-40', 'cursor-not-allowed');
            } else {
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
            }
        });
    }

    function toggleAllergyDetail(show) {
        const detailText = document.getElementById('allergy-detail');
        if (show) {
            detailText.classList.remove('hidden');
            detailText.setAttribute('required', 'true');
            detailText.focus();
        } else {
            detailText.classList.add('hidden');
            detailText.removeAttribute('required');
            detailText.value = '';
        }
    }

    function handleFormSubmit(event) {
        event.preventDefault();

        const now = new Date();
        const timestampStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

        let finalJob = selectedJob || '未回答';
        const detailText = document.getElementById('job-other').value.trim();

        if (selectedJob === '学生') {
            if (selectedStudentType) {
                finalJob = `学生 (${selectedStudentType})`;
            } else {
                finalJob = '学生';
            }
        } else if (selectedJob === 'その他' && detailText) {
            finalJob = `その他 (${detailText})`;
        }

        const triggerRadio = document.querySelector('input[name="trigger"]:checked');
        let finalTrigger = triggerRadio ? triggerRadio.value : '未回答';
        const triggerDetailText = document.getElementById('trigger-detail').value.trim();

        if (finalTrigger === '検索サイト') {
            if (selectedSearchType) {
                finalTrigger = `検索サイト (${selectedSearchType})`;
            }
        } else if (triggerDetailText && (finalTrigger === 'ご紹介' || finalTrigger === '自宅・職場が近い / その他')) {
            finalTrigger = `${finalTrigger} (${triggerDetailText})`;
        }

        const allergyRadio = document.querySelector('input[name="allergy"]:checked');
        let finalAllergy = allergyRadio ? allergyRadio.value : '未回答';
        const allergyDetailText = document.getElementById('allergy-detail').value.trim();
        if (finalAllergy === 'あり' && allergyDetailText) {
            finalAllergy = `あり (${allergyDetailText})`;
        }

        const rawBirthdate = document.getElementById('birthdate').value;
        let formattedBirthdate = '';
        if (rawBirthdate) {
            const bd = new Date(rawBirthdate);
            formattedBirthdate = `${bd.getFullYear()}/${String(bd.getMonth() + 1).padStart(2, '0')}/${String(bd.getDate()).padStart(2, '0')}`;
        }

        const serviceRadio = document.querySelector('input[name="service-request"]:checked');
        const finalService = serviceRadio ? serviceRadio.value : '未回答';

        // GASスクリプトに送信するデータ
        const formData = {
            timestamp: timestampStr,
            shop: currentShop,
            kana: document.getElementById('kana').value.trim(),
            name: document.getElementById('name').value.trim(),
            birthdate: formattedBirthdate || '未登録',
            gender: document.querySelector('input[name="gender"]:checked').value,
            zip: document.getElementById('zip').value.trim(),
            address: document.getElementById('address').value.trim(),
            tel: document.getElementById('tel').value.trim(),
            email: document.getElementById('email').value.trim(),
            job: finalJob,
            trigger: finalTrigger,
            service: finalService,
            demand: selectedDemands.length > 0 ? selectedDemands.join(', ') : '未選択',
            allergy: finalAllergy
        };

        // GASエンドポイントに送信
       const gasUrl = 'https://script.google.com/macros/s/AKfycbx0mgQ4jI5_YJvj5euDqFwCZRJvACjwbM0j7acW0TXJVNGF2ZQ2EkhAiMFCZRLyrA5n/exec'
        
        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            console.log('GASへのデータ送信完了');
            // フォーム送信完了モーダルを表示
            document.getElementById('success-modal').classList.remove('hidden');
        })
        .catch(error => {
            console.error('GAS送信エラー:', error);
            // エラーでもモーダルは表示（スプレッドシート記録失敗時の対応が必要な場合は別途修正）
            document.getElementById('success-modal').classList.remove('hidden');
        });
    }

    function closeSuccessModal() {
        document.getElementById('success-modal').classList.add('hidden');
        document.getElementById('karte-form').reset();
        
        selectedJob = '';
        selectedStudentType = '';
        selectedSearchType = '';

        const jobBtns = document.querySelectorAll('.job-btn');
        jobBtns.forEach(b => b.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary'));
        
        const subStudentBtns = document.querySelectorAll('.student-type-btn');
        subStudentBtns.forEach(b => b.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary'));

        const subSearchBtns = document.querySelectorAll('.search-type-btn');
        subSearchBtns.forEach(b => b.classList.remove('bg-salon-primary', 'text-white', 'border-salon-primary'));

        document.getElementById('student-options').classList.add('hidden');
        document.getElementById('search-options').classList.add('hidden');
        document.getElementById('job-other').classList.add('hidden');
        document.getElementById('trigger-detail').classList.add('hidden');
        document.getElementById('allergy-detail').classList.add('hidden');

        selectedDemands = [];
        document.getElementById('demand-counter').innerText = '0 / 3';
        const demandBtns = document.querySelectorAll('.demand-btn');
        demandBtns.forEach(btn => {
            btn.classList.remove('bg-salon-light', 'border-salon-primary', 'font-bold', 'opacity-40', 'cursor-not-allowed');
            btn.classList.add('bg-white');
            const icon = btn.querySelector('i');
            icon.className = 'fa-regular fa-square text-gray-300 text-sm';
        });

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
